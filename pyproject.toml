[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "serverhub-ai-os"
version = "1.0.0"
description = "Native Linux infrastructure control plane with policy-gated durable AI operations"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "ServerHub Engineering" }]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "httpx>=0.28,<1",
  "argon2-cffi>=23.1,<26", "cryptography>=50.0.2,<51", "psutil>=6,<8",
  "pydantic-settings>=2.7,<3", "PyYAML>=6,<7", "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
serverhub = "serverhub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/serverhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
