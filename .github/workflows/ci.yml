name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: serverhub
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: serverhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U serverhub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest --junitxml=test-results/backend.xml
        env:
          SERVERHUB_DEV_MODE: 'true'
          SERVERHUB_TEST_DATABASE_CONFIRM: isolated
          SERVERHUB_DATABASE_URL: postgresql+psycopg://serverhub:isolated-ci-only@127.0.0.1:5432/serverhub_test
          SERVERHUB_TEST_POSTGRES_URL: postgresql+psycopg://serverhub:isolated-ci-only@127.0.0.1:5432/serverhub_test
      - run: python -m build
      - run: python -m serverhub.ops.installer --stage --root "$RUNNER_TEMP/serverhub-stage" --source .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: test-results/
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.lock
  native-ubuntu:
    runs-on: ubuntu-24.04
    needs: frontend
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build through the documented fresh-Ubuntu workflow
        run: ./scripts/install-ubuntu.sh --build-only
      - name: Native install, interruption, resume, model setup, delegated job and upgrade
        id: native_install
        run: sudo env SERVERHUB_DISPOSABLE_TEST=fresh-ubuntu-ci GITHUB_ACTIONS=true PYTHONPATH="$PWD/src" "$PWD/.build-venv/bin/python" scripts/test-native-ubuntu.py
      - name: Actual package transactions and database-consistent Docker restore
        run: sudo env SERVERHUB_DISPOSABLE_TEST=fresh-ubuntu-ci GITHUB_ACTIONS=true PYTHONPATH="$PWD/src" "$PWD/.build-venv/bin/python" scripts/test-host-operations.py
      - name: Real qwen autonomous Jarvis source repair and native staging rollback
        if: always() && steps.native_install.outcome == 'success'
        run: sudo env SERVERHUB_DISPOSABLE_TEST=fresh-ubuntu-ci GITHUB_ACTIONS=true PYTHONPATH="$PWD/src" "$PWD/.build-venv/bin/python" scripts/test-jarvis-pilot.py
      - name: Native service diagnostics
        if: failure()
        run: |
          sudo cat /var/lib/serverhub-broker/diagnostics/latest.json || true
          sudo systemctl show serverhub-broker -p CapabilityBoundingSet -p NoNewPrivileges -p User -p Group -p SystemCallFilter
          sudo systemctl status serverhub-api serverhub-worker serverhub-broker --no-pager || true
          sudo journalctl -u serverhub-api -u serverhub-worker -u serverhub-broker --no-pager -n 100 || true
