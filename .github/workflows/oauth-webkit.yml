name: oauth-webkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  oauth-webkit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' playwright==1.64.1
      - run: python -m playwright install --with-deps webkit
      - run: python -m pytest tests/test_oauth_browser.py --junitxml=test-results/oauth-webkit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oauth-webkit-results
          path: test-results/
