# Install root-owned, mode 0640, under /etc/serverhub/models.yaml.
# Every route shares the caller's actual role and policy. Route names grant nothing.
routes:
  default:
    kind: ollama
    base_url: http://127.0.0.1:11434
    model: REPLACE_WITH_INSTALLED_TOOL_CAPABLE_MODEL
    max_output_tokens: 2048
    context_limit: 65536
    timeout_seconds: 90
    max_retries: 2
